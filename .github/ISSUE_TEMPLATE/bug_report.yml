name: Bug report
description: Something in the planner behaves unexpectedly.
body:
  - type: markdown
    attributes:
      value: Use invented amounts and 2099 dates. Do not attach a real plan link, bank file, account details or browser storage. For security issues, follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the result you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps with invented inputs
      description: Give enough detail to reproduce the problem. Use 2099 dates for fixed examples.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Safari on iPhone, or Chrome on desktop
  - type: input
    id: version
    attributes:
      label: App version or commit, if known
